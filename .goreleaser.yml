version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/dmts
    binary: dmts
    ldflags:
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  - repository:
      owner: kanmu
      name: homebrew-tools
    homepage: https://github.com/kanmu/demitas2
    description: Wrapper for ecspresso that creates task definitions at run time.
    license: MIT
    binaries:
      - dmts
    # Homebrew 7 deprecates the postflight block that hooks.post.install
    # renders, so emit postflight_steps via custom_block instead. goreleaser
    # templates the whole cask, so {{staged_path}} is written as a template
    # producing that literal, expanded by Homebrew at install time. Move this
    # to the dedicated goreleaser field once it ships (goreleaser#6870).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/dmts"]
        end
      end
